name: Fix Telegram report item limits
on:
  push:
    paths:
      - '.github/workflows/fix-report-limits.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove display limits
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/telegram/webhook/route.ts')
          s = p.read_text()
          s = s.replace('for (const item of items.slice(0, 12)) appendPurchaseBlock(lines, item, true);', 'for (const item of items) appendPurchaseBlock(lines, item, true);')
          s = s.replace('for (const item of report.items.slice(0, 10)) appendPurchaseBlock(lines, item, Boolean(item.installments));', 'for (const item of report.items) appendPurchaseBlock(lines, item, Boolean(item.installments));')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/telegram/webhook/route.ts
          git diff --cached --quiet || git commit -m 'Show all expenses in Telegram reports'
          git push